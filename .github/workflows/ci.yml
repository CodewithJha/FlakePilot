name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    services:
      # CI-only test database; not shipped, so the ADR-007 image review does not apply.
      postgres:
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # postgres:16.15
        env:
          POSTGRES_PASSWORD: ci-test-only-password # throwaway, CI-only, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
      - name: Validate Python version
        run: |
          uv python install
          "$(uv python find)" -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest
        env:
          FLAKEPILOT_TEST_DATABASE_URL: postgresql://postgres:ci-test-only-password@localhost:5432/postgres
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run lint-imports
      # Python packages only; shipped container images need the separate ADR-007 licence review.
      # Exceptions are recorded in pyproject.toml next to [tool.pip-licenses].
      - name: Licence gate (dev environment)
        run: uv run pip-licenses --ignore-packages pathspec:1.1.1
      - name: Licence gate (runtime environment, no exceptions)
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-runtime uv sync --locked --no-dev
          uv run pip-licenses --python .venv-runtime/bin/python
