name: isolation-validation

# Manual measurement only. A GitHub-hosted runner is not a FlakePilot
# execution host. This job is not part of push CI: a failed measurement must
# not leave the repository red. The harness assertions stay strict. The job
# does not enable execution and does not mark isolation checks passed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
      - name: Run isolation probes
        env:
          GITHUB_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: bash ops/isolation/run.sh
