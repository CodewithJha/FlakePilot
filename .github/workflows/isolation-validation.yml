name: isolation-validation

# Measurement lab only. A GitHub-hosted runner is not a FlakePilot execution
# host. This job runs self-authored probes. It does not enable execution, and
# it does not mark isolation checks passed. A red run is a measurement.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/isolation/**
      - .github/workflows/isolation-validation.yml

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
      - name: Run isolation probes
        env:
          GITHUB_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: bash ops/isolation/run.sh
