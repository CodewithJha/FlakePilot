[project]
name = "flakepilot"
version = "0.0.0"
description = "Evidence-based investigation and verification of recurring test failures."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.153.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# The URL comes only from FLAKEPILOT_DATABASE_URL (see migrations/env.py).
[tool.alembic]
script_location = "flakepilot.interface.composition_root:migrations"
version_locations = [
    "flakepilot.identity.infrastructure:migrations",
    "flakepilot.integrations.infrastructure:migrations",
    "flakepilot.test_intelligence.infrastructure:migrations",
    "flakepilot.diagnosis.infrastructure:migrations",
    "flakepilot.orchestration.infrastructure:migrations",
    "flakepilot.audit.infrastructure:migrations",
    "flakepilot.repository.infrastructure:migrations",
    "flakepilot.execution.infrastructure:migrations",
]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Untyped third-party imports (ADR-010 TQ-3): asyncpg ships no type information.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "integration: needs PostgreSQL; skipped unless FLAKEPILOT_TEST_DATABASE_URL is set",
]

# Licence gate (ADR-010 TQ-2): full locked environment, fail closed, exact matches only.
# SPDX "A OR B" expressions are not split by pip-licenses, so they are listed whole and
# only when every option is permissive. Elected licences for dual-licensed packages:
#   packaging (Apache-2.0 OR BSD-2-Clause): Apache-2.0
#   cryptography (Apache-2.0 OR BSD-3-Clause): Apache-2.0
# "MIT AND PSF-2.0" (greenlet) is conjunctive: both licences apply and both are permissive.
# "MIT-0" (cffi) is MIT No Attribution.
# Exceptions apply only to the dev-environment gate, as `--ignore-packages <name>:<version>`
# (a version change fails the gate and forces re-review). The runtime-environment gate applies none.
#   pathspec 1.1.1 | MPL-2.0 | dev-only transitive dependency of mypy; never shipped in
#   FlakePilot artifacts or images; used unmodified | approved by the project owner, 2026-10-20
[tool.pip-licenses]
from = "mixed"
with-system = true
allow-only = "Apache-2.0;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;BSD License;BSD-2-Clause;BSD-3-Clause;MIT;MIT AND PSF-2.0;MIT License;MIT-0;PSF-2.0"

# Boundary contracts (ADR-010 TQ-4; DEPENDENCY-RULES §1, §3.1, §5).
[tool.importlinter]
root_package = "flakepilot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers inside each context"
type = "layers"
containers = [
    "flakepilot.identity",
    "flakepilot.repository",
    "flakepilot.test_intelligence",
    "flakepilot.orchestration",
    "flakepilot.execution",
    "flakepilot.diagnosis",
    "flakepilot.patches",
    "flakepilot.verification",
    "flakepilot.approval",
    "flakepilot.integrations",
    "flakepilot.audit",
]
layers = ["infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Diagnosis isolation: no path from test_intelligence, verification, approval or patches"
type = "forbidden"
source_modules = [
    "flakepilot.test_intelligence",
    "flakepilot.verification",
    "flakepilot.approval",
    "flakepilot.patches",
]
forbidden_modules = ["flakepilot.diagnosis"]

[[tool.importlinter.contracts]]
name = "Other contexts are reached only through their application layer; nothing imports interface"
type = "forbidden"
source_modules = ["flakepilot.*"]
forbidden_modules = ["flakepilot.*.domain", "flakepilot.interface"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the composition root imports infrastructure"
type = "protected"
protected_modules = ["flakepilot.*.infrastructure"]
allowed_importers = ["flakepilot.interface.composition_root"]

[[tool.importlinter.contracts]]
name = "Only infrastructure layers and the composition root import SQLAlchemy or Alembic"
type = "protected"
protected_modules = ["sqlalchemy", "alembic"]
allowed_importers = ["flakepilot.*.infrastructure", "flakepilot.interface.composition_root"]

[[tool.importlinter.contracts]]
name = "Only integration adapters use cryptography"
type = "protected"
protected_modules = ["cryptography"]
allowed_importers = ["flakepilot.integrations.infrastructure"]

# With the domain, application and shared-kernel bans, only infrastructure may import asyncpg.
[[tool.importlinter.contracts]]
name = "The interface layer, composition root included, never imports the database driver"
type = "forbidden"
source_modules = ["flakepilot.interface"]
forbidden_modules = ["asyncpg"]

[[tool.importlinter.contracts]]
name = "Interface never calls integrations"
type = "forbidden"
source_modules = ["flakepilot.interface"]
forbidden_modules = ["flakepilot.integrations.application"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain layers and shared kernel depend only on the shared kernel, no frameworks or vendors"
type = "forbidden"
source_modules = ["flakepilot.*.domain", "flakepilot.shared_kernel"]
forbidden_modules = [
    "flakepilot.identity",
    "flakepilot.repository",
    "flakepilot.test_intelligence",
    "flakepilot.orchestration",
    "flakepilot.execution",
    "flakepilot.diagnosis",
    "flakepilot.patches",
    "flakepilot.verification",
    "flakepilot.approval",
    "flakepilot.integrations",
    "flakepilot.audit",
    "fastapi",
    "starlette",
    "pydantic",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "httpx",
    "requests",
    "aiohttp",
    "github",
    "githubkit",
    "boto3",
    "botocore",
    "playwright",
    "opentelemetry",
]

[[tool.importlinter.contracts]]
name = "Application layers use no frameworks, ORMs, drivers or vendor SDKs"
type = "forbidden"
source_modules = ["flakepilot.*.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "httpx",
    "requests",
    "aiohttp",
    "github",
    "githubkit",
    "boto3",
    "botocore",
    "playwright",
    "opentelemetry",
]

